<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>R4</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Audiowide&family=Chakra+Petch:wght@400;500;600;700&family=Russo+One&family=Rajdhani:wght@400;500;600;700&family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://v1.fontapi.ir/css/Doran" rel="stylesheet">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Rajdhani',system-ui,sans-serif;
  background:#f6f7fb;color:#0d1224;user-select:none;
  -webkit-font-smoothing:antialiased;
}

.fa, .fa *, .stat .k, .hint, .tiny-hint, .big, .final span{
  font-family:'Doran','Vazirmatn',Tahoma,sans-serif;
}

/* BACKGROUND */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(1200px 800px at 15% -10%, #eaf0ff 0%, transparent 60%),
  radial-gradient(1000px 700px at 90% 10%, #ffeef6 0%, transparent 55%),
  radial-gradient(900px 900px at 50% 115%, #e9fbf4 0%, transparent 60%),
  #f7f8fc;
}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;mix-blend-mode:multiply}
.b1{width:520px;height:520px;background:#c7d7ff;top:-160px;left:-120px;animation:float1 22s ease-in-out infinite}
.b2{width:460px;height:460px;background:#ffd0e6;top:8%;right:-140px;animation:float2 26s ease-in-out infinite}
.b3{width:600px;height:600px;background:#c3f5e0;bottom:-260px;left:35%;animation:float3 30s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(90px,70px) scale(1.15)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-80px,110px) scale(1.1)}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-90px) scale(1.12)}}

.grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(20,30,60,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(20,30,60,.045) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 10%,transparent 78%);
  mask-image:radial-gradient(circle at 50% 40%,#000 10%,transparent 78%);
}

/* FX + STAGE */
#fx{position:fixed;inset:0;z-index:25;pointer-events:none}
#stage{position:fixed;inset:0;z-index:10;will-change:transform}

/* CONFETTI LAYER */
#confetti{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden}
.confetti-piece{
  position:absolute;top:-24px;will-change:transform,opacity;
  box-shadow:0 2px 6px rgba(0,0,0,.06);
}

.danger{
  position:fixed;left:0;right:0;bottom:86px;height:2px;z-index:9;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,70,110,.45) 0 14px,transparent 14px 28px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);
  opacity:.7;
}

/* TOKENS */
.token-wrap{position:absolute;left:0;top:0;will-change:transform;transform:translate3d(0,0,0)}
.token{width:100%;height:100%;filter:drop-shadow(0 12px 20px rgba(15,22,55,.20))}
.token svg{width:100%;height:100%;display:block;overflow:visible}
.token.pop{animation:pop .44s cubic-bezier(.16,.95,.3,1) forwards}
@keyframes pop{
  0%{transform:scale(1) rotate(0deg);opacity:1}
  28%{transform:scale(1.32) rotate(7deg);opacity:1;filter:brightness(1.9) drop-shadow(0 0 22px rgba(255,255,255,.9))}
  100%{transform:scale(.12) rotate(46deg);opacity:0}
}
.token.miss{animation:miss .38s ease-in forwards}
@keyframes miss{
  0%{transform:translateY(0) scale(1);opacity:1}
  100%{transform:translateY(60px) scale(.7);opacity:0;filter:grayscale(1) brightness(.6)}
}

/* HUD */
.hud{
  position:fixed;top:0;left:0;right:0;z-index:40;
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:16px 22px;direction:ltr;pointer-events:none;
}
.hud-side{display:flex;gap:26px}
.stat{display:flex;flex-direction:column;gap:3px;min-width:66px}
.stat .k{font-size:11px;font-weight:700;color:#8b93ad}
.stat .v{
  font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;
  line-height:1;color:#0d1224;font-variant-numeric:tabular-nums;
}
.stat .v.accent{background:linear-gradient(135deg,#3b82f6,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}

.brand{
  font-family:'Audiowide',cursive;font-weight:400;font-size:30px;
  letter-spacing:.1em;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6 50%,#ec4899);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 12px rgba(120,80,255,.28));
}

/* ---- HEARTS ---- */
.lives{
  display:flex;gap:4px;padding-top:4px;justify-content:flex-end;
  align-items:center;
}
.life{
  width:22px;height:22px;
  color:#e11d48;
  transition:transform .28s cubic-bezier(.2,.9,.3,1), color .28s, filter .28s;
  filter:drop-shadow(0 3px 5px rgba(225,29,72,.4));
  will-change:transform;
}
.life svg{width:100%;height:100%;display:block}
.life.gone{
  color:#dde1ec;
  filter:none;
  transform:scale(.65) rotate(-12deg);
}
.life.pulse{
  animation:lifePulse .55s cubic-bezier(.16,.95,.3,1);
}
@keyframes lifePulse{
  0%{transform:scale(1)}
  35%{transform:scale(1.5)}
  70%{transform:scale(.9)}
  100%{transform:scale(1)}
}

/* PAD STRIP */
.pad-strip{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
  z-index:45;direction:ltr;
  display:flex;flex-wrap:wrap;justify-content:center;gap:7px;
  padding:8px 10px;max-width:96vw;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(18px) saturate(1.6);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);
  border:1px solid rgba(18,26,58,.08);
  border-radius:20px;
  box-shadow:0 18px 42px -18px rgba(15,22,55,.4), 0 2px 0 rgba(255,255,255,.9) inset;
}
.chip{
  min-width:46px;height:42px;padding:0 8px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron','Russo One',system-ui,sans-serif;
  font-size:14px;font-weight:800;color:#7b839b;background:#f2f4fa;
  border:1px solid rgba(18,26,58,.06);
  transition:transform .11s ease, background .11s ease, color .11s ease, box-shadow .11s ease;
  will-change:transform;
}
.chip.active{
  color:#fff;background:var(--c);
  transform:translateY(-5px) scale(1.1);
  box-shadow:0 10px 22px -8px var(--c), 0 0 0 3px rgba(255,255,255,.6);
}
.chip.correct-flash{animation:chipCorrect .55s cubic-bezier(.2,.9,.3,1)}
@keyframes chipCorrect{
  0%{transform:translateY(0) scale(1)}
  30%{transform:translateY(-10px) scale(1.22);background:#12c78a;color:#fff;box-shadow:0 0 0 4px rgba(18,199,138,.4)}
  100%{transform:translateY(0) scale(1)}
}
.chip.wrong-flash{animation:chipWrong .5s ease}
@keyframes chipWrong{
  0%{transform:translateY(0) scale(1)}
  30%{transform:translateY(6px) scale(.94);background:#ef4444;color:#fff}
  100%{transform:translateY(0) scale(1)}
}

/* OVERLAY */
.overlay{
  position:fixed;inset:0;z-index:60;
  display:flex;align-items:center;justify-content:center;
  background:rgba(246,247,251,.62);
  backdrop-filter:blur(16px) saturate(1.4);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);
  transition:opacity .45s ease, visibility .45s;
  padding:20px;
}
.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}

.panel{
  width:min(560px,94vw);
  background:rgba(255,255,255,.9);
  border:1px solid rgba(18,26,58,.07);
  border-radius:32px;padding:44px 36px 30px;
  text-align:center;
  box-shadow:0 40px 90px -40px rgba(15,22,55,.5), 0 2px 0 rgba(255,255,255,.9) inset;
  animation:panelIn .6s cubic-bezier(.16,.95,.3,1) both;
}
@keyframes panelIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.panel.hidden{display:none}

.pad-icon{
  width:96px;height:96px;margin:0 auto 22px;
  display:flex;align-items:center;justify-content:center;
  border-radius:28px;background:linear-gradient(145deg,#ffffff,#eef1fa);
  box-shadow:0 18px 36px -18px rgba(30,45,100,.5), 0 2px 0 #fff inset;
  animation:bob 2.4s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.pad-icon svg{width:54px;height:54px}

.fa{
  font-weight:900;font-size:clamp(20px,4.2vw,30px);line-height:1.7;
  direction:rtl;
  background:linear-gradient(135deg,#1e293b,#334155 40%,#0f172a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:10px;
}
.en{
  font-family:'Chakra Petch',sans-serif;font-weight:600;
  font-size:12px;letter-spacing:.3em;color:#98a0b8;
  margin-bottom:22px;text-transform:uppercase;direction:ltr;
}
.big{
  font-weight:900;font-size:clamp(32px,7vw,52px);line-height:1.3;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6,#ec4899);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:8px;
}

.status{
  display:inline-flex;align-items:center;gap:9px;
  font-family:'Doran','Vazirmatn',Tahoma,sans-serif;
  font-size:14px;font-weight:700;
  color:#7b839b;background:#f3f5fb;
  border:1px solid rgba(18,26,58,.06);
  padding:9px 18px;border-radius:999px;margin-bottom:16px;
}
.status .dot{
  width:9px;height:9px;border-radius:50%;background:#cbd2e2;
  transition:.3s;flex:none;
}
.status.on{color:#0f9d6e;background:#e9fbf3;border-color:rgba(15,157,110,.18)}
.status.on .dot{background:#12c78a;box-shadow:0 0 0 4px rgba(18,199,138,.2);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(18,199,138,.25)}50%{box-shadow:0 0 0 8px rgba(18,199,138,0)}}

.hint{
  font-weight:700;font-size:14px;color:#8891aa;
  margin-top:12px;line-height:2;
  transition:opacity .4s ease;
}
.hint .kp{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:8px;
  background:linear-gradient(145deg,#3b82f6,#2563eb);
  color:#fff;font-family:'Orbitron',sans-serif;font-weight:800;font-size:12px;
  box-shadow:0 4px 10px -2px rgba(37,99,235,.6);
  vertical-align:middle;margin:0 4px;
}
.hint.dim{opacity:.4}

.tiny-hint{
  font-size:10.5px;font-weight:500;color:#b3bacd;
  margin-top:20px;line-height:1.9;direction:rtl;
  transition:opacity .5s ease, transform .5s ease;
  opacity:1;
}
.tiny-hint.gone{
  opacity:0;transform:translateY(-4px);
  pointer-events:none;height:0;margin-top:0;overflow:hidden;
}

.btn{
  font-family:'Doran','Vazirmatn',Tahoma,sans-serif;
  font-weight:900;font-size:19px;color:#fff;border:none;cursor:pointer;
  padding:17px 52px;border-radius:18px;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6 55%,#ec4899);
  background-size:200% 200%;
  box-shadow:0 18px 34px -14px rgba(99,102,241,.85), 0 2px 0 rgba(255,255,255,.35) inset;
  transition:transform .16s cubic-bezier(.2,.9,.3,1), box-shadow .16s, filter .2s;
  animation:gradShift 6s ease infinite;
}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.btn:hover:not(:disabled){transform:translateY(-3px) scale(1.03);box-shadow:0 26px 46px -16px rgba(99,102,241,.9)}
.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn:disabled{filter:grayscale(1) opacity(.45);cursor:not-allowed;animation:none;background:#c8cee0;box-shadow:none}

#startBtn{ margin-bottom:18px; }

.final{
  display:flex;justify-content:center;gap:14px;margin:26px 0 30px;direction:ltr;flex-wrap:wrap;
}
.final>div{
  flex:1;min-width:104px;
  background:#f4f6fc;border:1px solid rgba(18,26,58,.06);
  border-radius:18px;padding:14px 10px;
  display:flex;flex-direction:column;gap:6px;
}
.final span{font-size:11px;font-weight:700;color:#98a0b8;direction:rtl}
.final b{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;color:#0d1224}

/* FLASH & BANNER */
#flash{
  position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.95),rgba(255,255,255,0) 65%);
}
#banner{
  position:fixed;top:22%;left:50%;transform:translate(-50%,-50%) scale(.7);
  z-index:55;pointer-events:none;opacity:0;
  font-family:'Doran','Vazirmatn',Tahoma,sans-serif;font-weight:900;
  font-size:clamp(28px,6vw,56px);letter-spacing:.02em;
  background:linear-gradient(135deg,#3b82f6,#a855f7,#ec4899);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 12px 30px rgba(120,80,255,.35));
  white-space:nowrap;
}
#banner.show{animation:bannerPop 1.15s cubic-bezier(.16,.95,.3,1) forwards}
@keyframes bannerPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
  40%{transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-90%) scale(1.02)}
}

@media (max-width:640px){
  .hud{padding:10px 12px}
  .stat .v{font-size:19px}
  .stat{min-width:52px}
  .brand{font-size:22px}
  .hud-side{gap:14px}
  .chip{min-width:38px;height:36px;font-size:12px;border-radius:11px}
  .pad-strip{gap:5px;padding:6px 8px;bottom:8px}
  .panel{padding:32px 20px 24px;border-radius:26px}
  .life{width:18px;height:18px}
}
</style>
</head>
<body>

<div class="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grid"></div>
</div>

<div class="danger"></div>
<div id="stage"></div>
<canvas id="fx"></canvas>
<div id="confetti"></div>

<header class="hud">
  <div class="hud-side">
    <div class="stat"><span class="k">امتیاز</span><span class="v" id="scoreEl">0</span></div>
    <div class="stat"><span class="k">کمبو</span><span class="v accent" id="comboEl">×0</span></div>
  </div>
  <div class="brand">R4</div>
  <div class="hud-side" style="align-items:flex-end">
    <div class="stat" style="align-items:flex-end"><span class="k">مرحله</span><span class="v" id="levelEl">1</span></div>
    <div class="lives" id="livesEl"></div>
  </div>
</header>

<div class="pad-strip" id="padStrip"></div>

<div id="flash"></div>
<div id="banner"></div>

<div class="overlay" id="overlay">

  <div class="panel" id="panelConnect">
    <div class="pad-icon">
      <svg viewBox="0 0 64 64" fill="none" stroke="#2b3350" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 20h28c8.8 0 14 6.6 14 15s-4.2 13-10.4 13c-4.6 0-7-2.6-9.2-6.2-1.4-2.3-2.6-3.8-5.4-3.8h-6c-2.8 0-4 1.5-5.4 3.8C21.4 45.4 19 48 14.4 48 8.2 48 4 42.6 4 35s5.2-15 14-15z"/>
        <path d="M18 28v8M14 32h8" stroke="#3b82f6"/>
        <circle cx="44" cy="29" r="2.6" fill="#ec4899" stroke="none"/>
        <circle cx="50" cy="35" r="2.6" fill="#22c55e" stroke="none"/>
        <circle cx="38" cy="35" r="2.6" fill="#3b82f6" stroke="none"/>
        <circle cx="44" cy="41" r="2.6" fill="#f59e0b" stroke="none"/>
      </svg>
    </div>
    <h1 class="fa">لطفا دسته بازی خود را متصل نمایید!</h1>
    <p class="en">Connect your gamepad</p>

    <button class="btn" id="startBtn" disabled>شروع بازی</button>
    <div class="status" id="connStatus">
      <span class="dot"></span>
      <span id="connText">در انتظار اتصال...</span>
    </div>

    <p class="hint dim" id="startHint">پس از اتصال، دکمه <span class="kp">✕</span> را فشار دهید</p>
    <p class="tiny-hint" id="tinyHint">اگر دسته بازی‌تان هنوز متصل نشده است، یک دکمه را فشار دهید!</p>
  </div>

  <div class="panel hidden" id="panelOver">
    <h1 class="big">پایان بازی</h1>
    <p class="fa" style="font-size:16px;opacity:.6;margin-bottom:6px">نتیجه‌ی نهایی</p>
    <div class="final">
      <div><span>امتیاز</span><b id="finalScore">0</b></div>
      <div><span>بهترین کمبو</span><b id="finalCombo">×0</b></div>
      <div><span>مرحله</span><b id="finalLevel">1</b></div>
    </div>
    <button class="btn" id="againBtn">دوباره بازی کن</button>
    <p class="hint" id="againHint">برای شروع مجدد دکمه <span class="kp">✕</span> را فشار دهید</p>
  </div>

</div>

<script>
/* ============================================================
   HELPERS
============================================================ */
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const mtof = m => 440 * Math.pow(2,(m-69)/12);

function mixHex(hex, target, amt){
  const n = parseInt(hex.slice(1),16);
  const tr=(target>>16)&255, tg=(target>>8)&255, tb=target&255;
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=Math.round(r+(tr-r)*amt); g=Math.round(g+(tg-g)*amt); b=Math.round(b+(tb-b)*amt);
  return `rgb(${r},${g},${b})`;
}

/* ============================================================
   BUTTONS
============================================================ */
const BUTTONS = [
  { id:'cross',    index:0,  label:'✕',  color:'#3b82f6', pitch:0  },
  { id:'circle',   index:1,  label:'●',  color:'#ef4444', pitch:2  },
  { id:'square',   index:2,  label:'■',  color:'#ec4899', pitch:4  },
  { id:'triangle', index:3,  label:'▲',  color:'#22c55e', pitch:7  },
  { id:'up',       index:12, label:'↑',  color:'#8b5cf6', pitch:9  },
  { id:'right',    index:15, label:'→',  color:'#06b6d4', pitch:12 },
  { id:'left',     index:14, label:'←',  color:'#f59e0b', pitch:14 },
  { id:'down',     index:13, label:'↓',  color:'#14b8a6', pitch:16 },
  { id:'l1',       index:4,  label:'L1', color:'#6366f1', pitch:19 },
  { id:'r1',       index:5,  label:'R1', color:'#f43f5e', pitch:21 },
  { id:'l2',       index:6,  label:'L2', color:'#a855f7', pitch:24 },
  { id:'r2',       index:7,  label:'R2', color:'#f97316', pitch:26 }
];
const BTN_BY_INDEX = {};
BUTTONS.forEach(b => BTN_BY_INDEX[b.index] = b);

/* ============================================================
   AUDIO ENGINE
============================================================ */
const A = {
  ctx:null, master:null, musicGain:null, menuGain:null, sfxGain:null, musicFilter:null,
  unlocked:false,

  init(){
    if(this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    this.ctx = new C();

    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 24;
    comp.ratio.value = 5; comp.attack.value = 0.003; comp.release.value = 0.25;

    this.master = this.ctx.createGain();
    this.master.gain.value = 0.85;
    this.master.connect(comp);
    comp.connect(this.ctx.destination);

    this.musicFilter = this.ctx.createBiquadFilter();
    this.musicFilter.type = 'lowpass';
    this.musicFilter.frequency.value = 1400;
    this.musicFilter.Q.value = 0.6;

    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.0;
    this.musicGain.connect(this.musicFilter);
    this.musicFilter.connect(this.master);

    this.menuGain = this.ctx.createGain();
    this.menuGain.gain.value = 0.0;
    this.menuGain.connect(this.master);

    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.55;
    this.sfxGain.connect(this.master);
  },

  unlock(){
    this.init();
    if(!this.ctx) return;
    if(this.ctx.state === 'suspended') this.ctx.resume();
    this.unlocked = true;
    try { if(!state.running) MenuMusic.start(); } catch(e){}
  },

  setMusicVolume(v, time=1.2){
    if(!this.ctx) return;
    const t = this.ctx.currentTime;
    this.musicGain.gain.cancelScheduledValues(t);
    this.musicGain.gain.setValueAtTime(this.musicGain.gain.value, t);
    this.musicGain.gain.linearRampToValueAtTime(v, t + time);
  },

  setMenuVolume(v, time=1.2){
    if(!this.ctx) return;
    const t = this.ctx.currentTime;
    this.menuGain.gain.cancelScheduledValues(t);
    this.menuGain.gain.setValueAtTime(this.menuGain.gain.value, t);
    this.menuGain.gain.linearRampToValueAtTime(v, t + time);
  }
};

let _noiseBuf = null;
function noiseBuffer(){
  if(_noiseBuf) return _noiseBuf;
  const ctx = A.ctx;
  const len = Math.floor(ctx.sampleRate * 1.2);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
  _noiseBuf = buf;
  return buf;
}

/* ---------- SFX ---------- */
function sfxHit(btn, combo){
  if(!A.ctx || !A.unlocked) return;
  const ctx = A.ctx, t = ctx.currentTime, out = A.sfxGain;

  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer();
  src.playbackRate.value = rand(0.9, 1.15);
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 0.85;
  bp.frequency.setValueAtTime(2600, t);
  bp.frequency.exponentialRampToValueAtTime(280, t + 0.3);
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(0.55, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
  src.connect(bp).connect(ng).connect(out);
  src.start(t); src.stop(t + 0.36);

  const sub = ctx.createOscillator();
  sub.type = 'sine';
  const f0 = 170 + Math.min(combo,14) * 7;
  sub.frequency.setValueAtTime(f0, t);
  sub.frequency.exponentialRampToValueAtTime(42, t + 0.24);
  const sg = ctx.createGain();
  sg.gain.setValueAtTime(0.6, t);
  sg.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  sub.connect(sg).connect(out);
  sub.start(t); sub.stop(t + 0.32);

  const base = mtof(69 + btn.pitch + Math.min(combo, 12));
  [[0,'square',0.12],[7,'triangle',0.09],[12,'sine',0.07]].forEach(([semi, type, vol]) => {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(base * Math.pow(2, semi/12), t);
    o.frequency.exponentialRampToValueAtTime(base * Math.pow(2, semi/12) * 1.5, t + 0.18);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
    o.connect(g).connect(out);
    o.start(t); o.stop(t + 0.4);
  });
}

/* ---------- GAME OVER TUNE ---------- */
function sfxGameOver(){
  if(!A.ctx || !A.unlocked) return;
  const ctx = A.ctx, t0 = ctx.currentTime, out = A.sfxGain;

  const notes = [69, 67, 65, 64, 62, 60, 59, 57, 52, 45];
  notes.forEach((n, i) => {
    const t = t0 + i * 0.155;
    const o1 = ctx.createOscillator();
    o1.type = 'triangle';
    o1.frequency.value = mtof(n);
    const o2 = ctx.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = mtof(n) * 2;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.26, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0, t);
    g2.gain.linearRampToValueAtTime(0.07, t + 0.006);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o1.connect(g).connect(out);
    o2.connect(g2).connect(out);
    o1.start(t); o1.stop(t + 0.5);
    o2.start(t); o2.stop(t + 0.35);
  });

  const padStart = t0, padDur = 2.6;
  [45, 52].forEach(fr => {
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = mtof(fr);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, padStart);
    g.gain.linearRampToValueAtTime(0.11, padStart + 0.35);
    g.gain.linearRampToValueAtTime(0.001, padStart + padDur);
    o.connect(g).connect(out);
    o.start(padStart); o.stop(padStart + padDur + 0.1);
  });

  const bt = t0 + 1.35;
  const bo = ctx.createOscillator();
  bo.type = 'sine';
  bo.frequency.setValueAtTime(75, bt);
  bo.frequency.exponentialRampToValueAtTime(28, bt + 1.2);
  const bg = ctx.createGain();
  bg.gain.setValueAtTime(0.4, bt);
  bg.gain.exponentialRampToValueAtTime(0.001, bt + 1.4);
  bo.connect(bg).connect(out);
  bo.start(bt); bo.stop(bt + 1.5);
}

/* ============================================================
   GAME MUSIC
============================================================ */
const PROG = [
  { root:57, notes:[57,60,64] },
  { root:53, notes:[53,57,60] },
  { root:48, notes:[48,52,55] },
  { root:55, notes:[55,59,62] }
];

const Music = {
  playing:false, step:0, nextTime:0, tempo:112, timer:null,

  start(){
    if(!A.ctx || this.playing) return;
    this.playing = true; this.step = 0;
    this.nextTime = A.ctx.currentTime + 0.12;
    this.timer = setInterval(() => this.schedule(), 25);
  },
  stop(){
    this.playing = false;
    if(this.timer) clearInterval(this.timer);
    this.timer = null;
  },
  schedule(){
    if(!this.playing || !A.ctx) return;
    while(this.nextTime < A.ctx.currentTime + 0.16){
      this.playStep(this.step, this.nextTime);
      this.nextTime += (60 / this.tempo) / 4;
      this.step++;
    }
  },
  playStep(step, t){
    const bar = Math.floor(step / 16) % 4;
    const s = step % 16;
    const ch = PROG[bar];
    if(s === 0 || s === 8 || s === 14) this.kick(t);
    if(s % 2 === 1) this.hat(t, s % 4 === 3 ? 0.1 : 0.05);
    if(s % 4 === 2) this.snare(t);
    if(s === 0) this.bass(t, ch.root - 12, 1.4);
    if(s === 6 || s === 10) this.bass(t, ch.root - 12, 0.5);
    if(s % 2 === 0){
      const n = ch.notes[(s / 2) % ch.notes.length] + 12;
      this.pluck(t, mtof(n + 12), 0.15);
    }
    if(s === 0) this.pad(t, ch.notes.map(n => mtof(n)), (60 / this.tempo) * 4);
  },
  kick(t){
    const ctx = A.ctx;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(46, t + 0.11);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.95, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g).connect(A.musicGain);
    o.start(t); o.stop(t + 0.32);
  },
  hat(t, vol){
    const ctx = A.ctx;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer();
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 7200;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.055);
    src.connect(hp).connect(g).connect(A.musicGain);
    src.start(t); src.stop(t + 0.07);
  },
  snare(t){
    const ctx = A.ctx;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer();
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 0.9;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.13, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    src.connect(bp).connect(g).connect(A.musicGain);
    src.start(t); src.stop(t + 0.16);
  },
  bass(t, midi, dur){
    const ctx = A.ctx;
    const o = ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.value = mtof(midi);
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(700, t);
    f.frequency.exponentialRampToValueAtTime(240, t + dur);
    f.Q.value = 6;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.24, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(f).connect(g).connect(A.musicGain);
    o.start(t); o.stop(t + dur + 0.05);
  },
  pluck(t, freq, vol){
    const ctx = A.ctx;
    const o1 = ctx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = freq;
    const o2 = ctx.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = freq * 1.006; o2.detune.value = 4;
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(4200, t);
    f.frequency.exponentialRampToValueAtTime(900, t + 0.26);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o1.connect(f); o2.connect(f);
    f.connect(g).connect(A.musicGain);
    o1.start(t); o2.start(t);
    o1.stop(t + 0.32); o2.stop(t + 0.32);
  },
  pad(t, freqs, dur){
    const ctx = A.ctx;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.055, t + 0.7);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 2000;
    f.connect(g).connect(A.musicGain);
    freqs.forEach(fr => {
      const o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = fr;
      o.detune.value = rand(-7, 7);
      o.connect(f);
      o.start(t); o.stop(t + dur + 0.15);
    });
  }
};

const MenuMusic = {
  playing:false, timer:null, nextTime:0, step:0,
  melody: [69, 72, 76, 74, 71, 67, 71, 69, 64, 67, 71, 72],

  start(){

    this.nextTime = A.ctx.currentTime + 0.15;

  stop(){
    this.playing = false;
    if(this.timer) clearInterval(this.timer);
    this.timer = null;
    A.setMenuVolume(0.0, 1.0);
  },
  schedule(){
    if(!this.playing || !A.ctx) return;
    while(this.nextTime < A.ctx.currentTime + 0.3){
      this.playStep(this.step, this.nextTime);
      this.step++;
      this.nextTime += 1.6;
    }
  },
  playStep(step, t){
    const n = this.melody[step % this.melody.length];
    const ctx = A.ctx;

    const o1 = ctx.createOscillator();
    o1.type = 'sine';
    o1.frequency.value = mtof(n);
    const o2 = ctx.createOscillator();
    o2.type = 'triangle';
    o2.frequency.value = mtof(n) * 2.01;
    const g1 = ctx.createGain();
    g1.gain.setValueAtTime(0.0001, t);
    g1.gain.linearRampToValueAtTime(0.85, t + 0.18);
    g1.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.linearRampToValueAtTime(0.12, t + 0.12);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
    o1.connect(g1).connect(A.menuGain);
    o2.connect(g2).connect(A.menuGain);
    o1.start(t); o1.stop(t + 1.7);
    o2.start(t); o2.stop(t + 1.0);

    if(step % 4 === 0){
      const bass = ctx.createOscillator();
      bass.type = 'sine';
      bass.frequency.value = mtof(n - 24);
      const bg = ctx.createGain();
      bg.gain.setValueAtTime(0.0001, t);
      bg.gain.linearRampToValueAtTime(0.55, t + 0.35);
      bg.gain.exponentialRampToValueAtTime(0.001, t + 2.3);
      bass.connect(bg).connect(A.menuGain);
      bass.start(t); bass.stop(t + 2.4);
    }
  }
};

function tokenSVG(geom, btn){
  const id = 'grad' + (_uid++);
  const c = btn.color;
  const light = mixHex(c, 0xffffff, 0.42);
  const mid = mixHex(c, 0xffffff, 0.08);
  const dark = mixHex(c, 0x000000, 0.18);

  let body = '';
  if(geom === 'circle'){
    body = `<circle cx="0" cy="0" r="43" fill="url(#${id})"/>`;
  } else if(geom === 'square'){
    body = `<rect x="-39" y="-39" width="78" height="78" rx="21" fill="url(#${id})"/>`;
  } else if(geom === 'rect'){
    body = `<rect x="-47" y="-32" width="94" height="64" rx="20" fill="url(#${id})"/>`;
  } else {
    body = `<path d="M0,-38 L39,33 L-39,33 Z" fill="url(#${id})" stroke="url(#${id})" stroke-width="17" stroke-linejoin="round"/>`;
  }

  const glyphTransform = (geom === 'triangle')
    ? 'translate(0,10) scale(0.72)'
    : (geom === 'rect' ? 'scale(0.95)' : '');

  const highlight = (geom === 'triangle')
    ? `<ellipse cx="-9" cy="12" rx="16" ry="8" fill="#fff" opacity=".22" transform="rotate(-28 -9 12)"/>`
    : `<ellipse cx="-13" cy="-15" rx="19" ry="10" fill="#fff" opacity=".28" transform="rotate(-28 -13 -15)"/>`;

  return `

    <linearGradient id="${id}" x1="0" y1="0" x2="0.3" y2="1">

      <stop offset="48%" stop-color="${mid}"/>
      <stop offset="100%" stop-color="${dark}"/>

  </defs>
  <g style="filter:drop-shadow(0 6px 8px rgba(15,22,55,.18))">
    ${body}
    ${highlight}
    <g transform="${glyphTransform}">${GLYPHS[btn.id]}</g>
  </g>
</svg>`;
}

  canvas.width = Math.floor(state.W * state.DPR);

}

/* ============================================================
   DIFFICULTY CURVE — SMOOTH & UNIFORM
   ----------------------------------------------------------
   • Speed: pure linear, no cap. Grows ~1.25 px/s every second.
     Never plateaus — always increasing throughout the game.
   • Spawn: linear until it reaches a comfortable floor (0.42s).
     Even after that, speed keeps rising, so difficulty still
     always grows.
   • No level-up fanfare: level number is cosmetic only.
   ---------------------------------------------------------- */
function fallSpeed(){ return 78 + state.t * 1.25; }
function spawnEvery(){ return Math.max(0.42, 2.7 - state.t * 0.017); }
function levelOf(t){ return Math.floor(t / 15) + 1; }

/* ============================================================
   PARTICLES
============================================================ */
const particles = [];
const rings = [];

function burst(x, y, color, power = 1){
  const n = Math.round(32 * power);
  for(let i=0;i<n;i++){
    const a = Math.random() * Math.PI * 2;
    const sp = rand(90, 470) * power;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - rand(40, 200),
      life: 1, decay: rand(1.5, 3.2),
      size: rand(4, 13),
      color: Math.random() < 0.32 ? '#ffffff' : color,
      shape: Math.random() < 0.42 ? 'rect' : 'dot',
      rot: Math.random() * 6.283, vr: rand(-14, 14),
      grav: rand(1000, 1700)
    });
  }
  rings.push({ x, y, r: 10, vr: 620, life: 1, decay: 3.4, color, w: 5 });
  rings.push({ x, y, r: 6, vr: 380, life: 1, decay: 2.6, color: '#ffffff', w: 3 });
}

function drawFX(dt){
  ctx2d.clearRect(0, 0, state.W, state.H);

  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt * p.decay;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    p.vy += p.grav * dt;
    p.vx *= 0.985;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
    ctx2d.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx2d.fillStyle = p.color;
    if(p.shape === 'rect'){
      ctx2d.save();
      ctx2d.translate(p.x, p.y);
      ctx2d.rotate(p.rot);
      ctx2d.fillRect(-p.size/2, -p.size*0.3, p.size, p.size*0.6);
      ctx2d.restore();
    } else {
      ctx2d.beginPath();
      ctx2d.arc(p.x, p.y, p.size * 0.5 * p.life + 0.6, 0, 6.2832);
      ctx2d.fill();
    }
  }

  for(let i = rings.length - 1; i >= 0; i--){
    const r = rings[i];
    r.life -= dt * r.decay;
    if(r.life <= 0){ rings.splice(i, 1); continue; }
    r.r += r.vr * dt;
    r.vr *= 0.94;
    ctx2d.globalAlpha = Math.max(0, r.life) * 0.85;
    ctx2d.strokeStyle = r.color;
    ctx2d.lineWidth = Math.max(0.5, r.w * r.life);
    ctx2d.beginPath();
    ctx2d.arc(r.x, r.y, r.r, 0, 6.2832);
    ctx2d.stroke();
  }

  ctx2d.globalAlpha = 1;
}

/* ============================================================
   SCREEN SHAKE / FLASH / BANNER
============================================================ */
function shake(amount){ state.shake = Math.min(26, state.shake + amount); }

function updateShake(dt){
  if(state.shake > 0.2){
    const s = state.shake;
    const x = rand(-s, s), y = rand(-s, s);
    stage.style.transform = `translate3d(${x}px,${y}px,0)`;
    state.shake *= Math.pow(0.0016, dt);
  } else if(state.shake !== 0){
    state.shake = 0;
    stage.style.transform = 'translate3d(0,0,0)';
  }
}

function flash(color, strength = 0.55){
  flashEl.style.background = `radial-gradient(circle at 50% 50%, ${color}, transparent 68%)`;
  flashEl.style.transition = 'none';
  flashEl.style.opacity = strength;
  requestAnimationFrame(() => {
    flashEl.style.transition = 'opacity .42s ease-out';
    flashEl.style.opacity = 0;
  });
}

let bannerTimeout = null;
function showBanner(text){
  bannerEl.textContent = text;
  bannerEl.classList.remove('show');
  void bannerEl.offsetWidth;
  bannerEl.classList.add('show');
  clearTimeout(bannerTimeout);
  bannerTimeout = setTimeout(() => bannerEl.classList.remove('show'), 1200);
}

function flashChip(index, kind){
  const el = chipEls[index];
  if(!el) return;
  const cls = kind === 'correct' ? 'correct-flash' : 'wrong-flash';
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 620);
}

/* ============================================================
   CONFETTI
============================================================ */
const CONFETTI_COLORS = ['#3b82f6','#ec4899','#22c55e','#f59e0b','#8b5cf6','#06b6d4','#ef4444','#f97316','#a855f7','#eab308'];

function spawnConfetti(count = 180){
  const H = window.innerHeight;
  for(let i = 0; i < count; i++){
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    const color = pick(CONFETTI_COLORS);
    c.style.background = color;
    const w = 5 + Math.random()*8;
    const h = 10 + Math.random()*14;
    c.style.width = w + 'px';
    c.style.height = h + 'px';
    c.style.left = (Math.random()*100) + 'vw';
    c.style.top = '-24px';
    if(Math.random() < 0.3) c.style.borderRadius = '50%';
    else c.style.borderRadius = (Math.random() < 0.5 ? '2px' : '50% 2px');

    const dur = 2600 + Math.random()*2400;
    const delay = Math.random()*900;
    const rot = (Math.random()*900 - 450);
    const drift = (Math.random() - 0.5) * 260;
    const sway = (Math.random() - 0.5) * 120;

    c.animate([
      { transform: `translate3d(0,0,0) rotate(0deg)`, opacity: 1 },
      { transform: `translate3d(${drift*0.4}px, ${H*0.55}px, 0) rotate(${rot*0.5}deg)`, opacity: 1, offset: 0.55 },
      { transform: `translate3d(${drift+sway}px, ${H+80}px, 0) rotate(${rot}deg)`, opacity: 0.9 }
    ], {
      duration: dur, delay: delay,
      easing: 'cubic-bezier(.3,.55,.45,.95)',
      fill: 'forwards'
    });

    confettiLayer.appendChild(c);
    setTimeout(() => c.remove(), dur + delay + 250);
  }
}

/* ============================================================
   GAME LOGIC
============================================================ */
function makeShape(){
  const btn = pick(BUTTONS);
  const geom = pick(['circle', 'square', 'rect', 'triangle']);
  const size = state.tokenSize;

  const wrap = document.createElement('div');
  wrap.className = 'token-wrap';
  wrap.style.width = size + 'px';
  wrap.style.height = size + 'px';
  wrap.innerHTML = `<div class="token">${tokenSVG(geom, btn)}</div>`;
  stage.appendChild(wrap);

  return { el: wrap, inner: wrap.firstElementChild, btn, geom, size, lane:-1, x:0, y:-size };
}

function spawnShape(){
  const lanes = state.lanes;
  const free = [];
  const size = state.tokenSize;

  for(let i = 0; i < lanes.length; i++){
    const occupied = state.shapes.some(s => s.lane === i && s.y < size * 1.35);
    if(!occupied) free.push(i);
  }
  if(free.length === 0) return;

  const laneIdx = pick(free);
  const s = makeShape();
  s.lane = laneIdx;
  s.x = lanes[laneIdx] - size / 2;
  s.y = -size * 1.1;
  s.el.style.transform = `translate3d(${s.x}px, ${s.y}px, 0)`;

  s.inner.animate(
    [{ transform: 'scale(.4)', opacity: 0 }, { transform: 'scale(1.08)', opacity: 1 }, { transform: 'scale(1)', opacity: 1 }],
    { duration: 300, easing: 'cubic-bezier(.2,.9,.3,1)' }
  );

  state.shapes.push(s);
}

function getLowestShape(){
  let lowest = null;
  for(const s of state.shapes){
    if(!lowest || s.y > lowest.y) lowest = s;
  }
  return lowest;
}

function hitShape(s){
  const idx = state.shapes.indexOf(s);
  if(idx >= 0) state.shapes.splice(idx, 1);

  const cx = s.x + s.size / 2;
  const cy = s.y + s.size / 2;

  s.el.style.transform = `translate3d(${s.x}px, ${s.y}px, 0)`;
  s.inner.classList.add('pop');
  setTimeout(() => s.el.remove(), 470);

  burst(cx, cy, s.btn.color, 1);
  sfxHit(s.btn, state.combo);
  shake(5 + Math.min(state.combo, 12) * 0.5);
  flash(s.btn.color, 0.35);
  flashChip(s.btn.index, 'correct');

  state.combo++;
  if(state.combo > state.bestCombo) state.bestCombo = state.combo;

  const gain = 10 + Math.min(state.combo, 25) * 2;
  state.score += gain;

  if(state.combo > 0 && state.combo % 10 === 0){
    sfxCombo();
    showBanner(`کمبو ×${state.combo}`);
    flash('#a855f7', 0.45);
  }
}

function missShape(s){
  const idx = state.shapes.indexOf(s);
  if(idx >= 0) state.shapes.splice(idx, 1);
  s.inner.classList.add('miss');
  setTimeout(() => s.el.remove(), 400);
  loseLife(s.btn.index, 'floor');
}

function wrongPress(correctBtn){
  loseLife(correctBtn ? correctBtn.index : null, 'wrong');
}

function loseLife(correctIndex, reason){
  state.combo = 0;
  state.lives--;
  if(reason === 'wrong'){
    sfxWrong();
    showBanner('اشتباه!');
    if(correctIndex != null) flashChip(correctIndex, 'wrong');
  } else {
    sfxMiss();
  }
  shake(16);
  flash('#ef4444', 0.5);

  /* pulse the next heart (the one that was just lost) */
  pulseHeart(state.lives);

  if(state.lives <= 0) gameOver();
}

function pulseHeart(index){
  const hearts = livesEl.children;
  if(!hearts || !hearts[index]) return;
  const el = hearts[index];
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
  setTimeout(() => el.classList.remove('pulse'), 620);
}

/* ============================================================
   HUD
============================================================ */
let lastHud = { score:-1, combo:-1, level:-1, lives:-1 };

/* Heart SVG path — classic love-heart */
const HEART_PATH = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';

function heartSVG(){
  return `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="${HEART_PATH}"/></svg>`;
}

function buildLives(){
  livesEl.innerHTML = '';
  for(let i = 0; i < 5; i++){
    const d = document.createElement('div');
    d.className = 'life';
    d.innerHTML = heartSVG();
    livesEl.appendChild(d);
  }
}

function updateHUD(){
  if(state.score !== lastHud.score){
    scoreEl.textContent = state.score;
    lastHud.score = state.score;
  }
  if(state.combo !== lastHud.combo){
    comboEl.textContent = '×' + state.combo;
    lastHud.combo = state.combo;
  }
  if(state.level !== lastHud.level){
    levelEl.textContent = state.level;
    lastHud.level = state.level;
  }
  if(state.lives !== lastHud.lives){
    const dots = livesEl.children;
    for(let i = 0; i < dots.length; i++){
      dots[i].classList.toggle('gone', i >= state.lives);
    }
    lastHud.lives = state.lives;
  }
}

/* ============================================================
   GAMEPAD
============================================================ */
let prevButtons = {};

function getActivePad(){
  if(!navigator.getGamepads) return null;
  const pads = navigator.getGamepads();
  for(let i = 0; i < pads.length; i++){
    const p = pads[i];
    if(p && p.connected) return p;
  }
  return null;
}

function onPadConnected(pad){
  state.padConnected = true;
  state.padName = pad.id || 'GAMEPAD';
  connStatus.classList.add('on');
  connText.textContent = 'دسته بازی متصل شد!';
  startBtn.disabled = false;
  startHint.classList.remove('dim');
  tinyHint.classList.add('gone');
  prevButtons = {};
  flash('#12c78a', 0.35);
}

function onPadDisconnected(){
  state.padConnected = false;
  connStatus.classList.remove('on');
  connText.textContent = 'اتصال قطع شد — دوباره وصل کنید';
  startBtn.disabled = true;
  startHint.classList.add('dim');
  tinyHint.classList.remove('gone');
  prevButtons = {};
  if(state.running) gameOver();
}

window.addEventListener('gamepadconnected', e => {
  if(!state.padConnected) onPadConnected(e.gamepad);
});
window.addEventListener('gamepaddisconnected', () => {
  setTimeout(() => { if(!getActivePad()) onPadDisconnected(); }, 200);
});

function pollGamepad(){
  const pad = getActivePad();
  if(pad && !state.padConnected) onPadConnected(pad);
  if(!pad && state.padConnected) onPadDisconnected();
  if(!pad) return;

  const cur = {};
  for(let i = 0; i < pad.buttons.length; i++){
    const b = pad.buttons[i];
    cur[i] = !!(b.pressed || b.value > 0.5);
  }
  for(const key in chipEls){
    const el = chipEls[key];
    if(el) el.classList.toggle('active', !!cur[key]);
  }
  for(const key in cur){
    const idx = parseInt(key, 10);
    if(cur[key] && !prevButtons[key]) onButtonDown(idx);
  }
  prevButtons = cur;
}

/* ============================================================
   BUTTON DISPATCH
============================================================ */
function onButtonDown(idx){
  if(!A.unlocked) A.unlock();

  if(!state.running){
    if(idx === 0 && state.padConnected){
      if(!panelOver.classList.contains('hidden')){
        startGame();
      } else if(!panelConnect.classList.contains('hidden') && !startBtn.disabled){
        startGame();
      }
    }
    return;
  }

  if(state.shapes.length === 0) return;
  const lowest = getLowestShape();
  if(!lowest) return;
  if(idx === lowest.btn.index) hitShape(lowest);
  else wrongPress(lowest.btn);
}

/* ============================================================
   GAME FLOW
============================================================ */
function startGame(){
  A.unlock();
  if(!A.unlocked) return;

  MenuMusic.stop();
  A.setMusicVolume(0.55, 2.0);
  Music.start();

  state.shapes.forEach(s => s.el.remove());
  state.shapes = [];
  particles.length = 0;
  rings.length = 0;

  state.running = true;
  state.t = 0;
  state.score = 0;
  state.combo = 0;
  state.bestCombo = 0;
  state.lives = 5;
  state.level = 1;
  state.spawnTimer = 0.6;
  state.shake = 0;
  lastHud = { score:-1, combo:-1, level:-1, lives:-1 };

  buildLives();
  updateHUD();

  overlay.classList.add('hidden');
  panelOver.classList.add('hidden');
  panelConnect.classList.remove('hidden');

  showBanner('شروع!');
  flash('#3b82f6', 0.4);
}

function gameOver(){
  state.running = false;

  A.setMusicVolume(0.0, 0.7);
  setTimeout(() => Music.stop(), 800);
  sfxGameOver();

  spawnConfetti(180);

  $('#finalScore').textContent = state.score;
  $('#finalCombo').textContent = '×' + state.bestCombo;
  $('#finalLevel').textContent = state.level;

  panelConnect.classList.add('hidden');
  panelOver.classList.remove('hidden');
  overlay.classList.remove('hidden');

  state.shapes.forEach(s => {
    s.inner.classList.add('miss');
    setTimeout(() => s.el.remove(), 400);
  });
  state.shapes = [];

  flash('#ef4444', 0.6);
  shake(24);

  setTimeout(() => { if(!state.running) MenuMusic.start(); }, 2400);
}

startBtn.addEventListener('click', () => { A.unlock(); startGame(); });
againBtn.addEventListener('click', () => { A.unlock(); startGame(); });

['pointerdown','keydown','touchstart'].forEach(ev => {
  window.addEventListener(ev, () => { A.unlock(); }, { once:true, passive:true });
});

window.addEventListener('blur', () => {
  if(state.running) A.setMusicVolume(0.12, 0.4);
});
window.addEventListener('focus', () => {
  if(state.running) A.setMusicVolume(0.55, 0.6);
});

/* ============================================================
   MAIN LOOP
============================================================ */
let lastTime = performance.now();

function loop(now){
  requestAnimationFrame(loop);

  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if(dt > 0.06) dt = 0.06;
  if(dt < 0) dt = 0;

  pollGamepad();

  if(state.running){
    state.t += dt;

    /* level is cosmetic only — no banner, no flash, no fanfare.
       Difficulty grows continuously every frame regardless. */
    const newLevel = levelOf(state.t);
    if(newLevel !== state.level){
      state.level = newLevel;
      sfxLevelTick(); /* very subtle chime */
      if(A.ctx) A.musicFilter.frequency.setTargetAtTime(
        Math.min(6500, 1400 + state.level * 320), A.ctx.currentTime, 1.6
      );
    }

    state.spawnTimer -= dt;
    if(state.spawnTimer <= 0){
      spawnShape();
      state.spawnTimer = spawnEvery();
    }

    const sp = fallSpeed();
    const deathLine = state.H - 86;
    for(let i = state.shapes.length - 1; i >= 0; i--){
      const s = state.shapes[i];
      s.y += sp * dt;
      s.el.style.transform = `translate3d(${s.x}px, ${s.y}px, 0)`;
      if(s.y + s.size * 0.85 > deathLine) missShape(s);
    }

    updateHUD();
  }

  drawFX(dt);
  updateShake(dt);
}

requestAnimationFrame(loop);

/* ============================================================
   INIT
============================================================ */
buildLives();
updateHUD();
startHint.classList.add('dim');

setInterval(() => {
  const pad = getActivePad();
  if(pad && !state.padConnected) onPadConnected(pad);
}, 400);
</script>
